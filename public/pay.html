<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elevated Vitality — Secure Checkout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0eeea; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; color: #111; }
    .card { background: #fff; border-radius: 16px; padding: 2rem; width: 100%; max-width: 480px; }
    .logo-area { text-align: center; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #ebebeb; }
    .logo-main { font-size: 28px; font-weight: 700; color: #333; letter-spacing: -0.5px; line-height: 1; }
    .logo-script { font-size: 20px; font-style: italic; font-weight: 400; color: #444; font-family: Georgia, serif; display: block; margin-top: 2px; }
    .logo-sub { font-size: 12px; color: #999; margin-top: 6px; }
    .order-summary { background: #f7f6f3; border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; }
    .order-row { display: flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 4px; }
    .order-row.total { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 0; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e5e5; }
    .section-label { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.9px; margin-bottom: 10px; }
    .field-group { margin-bottom: 12px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card-row { display: grid; grid-template-columns: 1fr 80px 70px; gap: 12px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 500; }
    input { width: 100%; height: 44px; padding: 0 14px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; color: #111; background: #f7f6f3; transition: border-color 0.15s, background 0.15s; }
    input:focus { outline: none; border-color: #111; background: #fff; }
    input::placeholder { color: #bbb; }
    .divider { height: 1px; background: #ebebeb; margin: 1.25rem 0; }
    .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-icons { display: flex; gap: 6px; }
    .card-icon { height: 22px; padding: 2px 8px; border: 1px solid #e5e5e5; border-radius: 4px; font-size: 10px; font-weight: 700; color: #888; display: flex; align-items: center; background: #fff; }
    .pay-btn { width: 100%; height: 50px; background: #111; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 1.5rem; letter-spacing: 0.2px; transition: background 0.15s; }
    .pay-btn:hover { background: #333; }
    .pay-btn:disabled { background: #888; cursor: not-allowed; }
    .security-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; color: #aaa; font-size: 12px; }
    .alert { border-radius: 10px; padding: 1rem; margin-bottom: 1rem; font-size: 14px; display: none; }
    .alert-error { background: #fdf0f0; border: 1px solid #f5c6c6; color: #c0392b; }
    .alert-success { background: #f0fdf4; border: 1px solid #b6e8c7; color: #1a6b3a; }
    #threeds-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
    #threeds-overlay.active { display: flex; }
    #threeds-frame { width: 90%; max-width: 500px; height: 600px; border: none; border-radius: 16px; background: #fff; }
    .threeds-close { position: absolute; top: 1rem; right: 1rem; background: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    @media (max-width: 500px) {
      .card { padding: 1.25rem; }
      .card-row { grid-template-columns: 1fr 1fr; }
      .card-row > div:last-child { grid-column: 1; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-area">
    <div class="logo-main">elevated.</div>
    <span class="logo-script">Vitality</span>
    <div class="logo-sub">Research Use Only Peptides</div>
  </div>

  <div class="alert alert-error" id="alert-error"></div>
  <div class="alert alert-success" id="alert-success"></div>

  <div class="order-summary">
    <div id="order-items"></div>
    <div class="order-row total">
      <span>Total due today</span>
      <span id="order-total">—</span>
    </div>
  </div>

  <div class="section-label">Contact</div>
  <div class="field-group">
    <div class="field-row">
      <div><label>First name</label><input type="text" id="fname" placeholder="John" required/></div>
      <div><label>Last name</label><input type="text" id="lname" placeholder="Smith" required/></div>
    </div>
  </div>
  <div class="field-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="john@example.com" required/>
  </div>
  <div class="field-group">
    <label>Phone</label>
    <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required/>
  </div>

  <div class="divider"></div>

  <div class="section-label">Billing address</div>
  <div class="field-group">
    <label>Address</label>
    <input type="text" id="address" placeholder="123 Main Street" required/>
  </div>
  <div class="field-group">
    <div class="field-row">
      <div><label>City</label><input type="text" id="city" placeholder="Tampa" required/></div>
      <div><label>ZIP code</label><input type="text" id="zip" placeholder="33602" required/></div>
    </div>
  </div>
  <div class="field-group">
    <div class="field-row">
      <div><label>State</label><input type="text" id="state" placeholder="FL" maxlength="3" required/></div>
      <div><label>Country</label><input type="text" id="country" placeholder="US" maxlength="2" value="US" required/></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="row-between">
    <div class="section-label" style="margin-bottom:0;">Card details</div>
    <div class="card-icons">
      <div class="card-icon">VISA</div>
      <div class="card-icon">MC</div>
      <div class="card-icon">AMEX</div>
    </div>
  </div>

  <div class="field-group">
    <label>Card number</label>
    <input type="text" id="ccnum" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric"/>
  </div>
  <div class="field-group card-row">
    <div><label>Expiry month</label><input type="text" id="ccmonth" placeholder="MM" maxlength="2" inputmode="numeric"/></div>
    <div><label>Year</label><input type="text" id="ccyear" placeholder="YYYY" maxlength="4" inputmode="numeric"/></div>
    <div><label>CVC</label><input type="text" id="cvc" placeholder="123" maxlength="3" inputmode="numeric"/></div>
  </div>

  <button class="pay-btn" id="pay-btn" onclick="handlePay()">Complete payment</button>

  <div class="security-row">
    <svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M6 0L0 2.5V7c0 3.3 2.6 6.3 6 7 3.4-.7 6-3.7 6-7V2.5L6 0z" fill="#aaa"/></svg>
    <span>Secured with 256-bit SSL encryption</span>
  </div>
</div>

<div id="threeds-overlay">
  <button class="threeds-close" onclick="closeThreeDs()">✕</button>
  <iframe id="threeds-frame" title="3D Secure Authentication"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderId     = params.get('order_id') || '';
  const orderToken  = params.get('token') || '';
  const amount      = params.get('amount') || '0.00';
  const currency    = params.get('currency') || 'USD';
  const itemsRaw    = params.get('items') || '';
  const custEmail   = params.get('email') || '';
  const custFirst   = params.get('first_name') || '';
  const custLast    = params.get('last_name') || '';
  const custPhone   = params.get('phone') || '';
  const custAddress = params.get('address') || '';
  const custCity    = params.get('city') || '';
  const custZip     = params.get('zip') || '';
  const custState   = params.get('province') || '';
  const custCountry = params.get('country') || 'US';

  document.getElementById('email').value   = custEmail;
  document.getElementById('fname').value   = custFirst;
  document.getElementById('lname').value   = custLast;
  document.getElementById('phone').value   = custPhone;
  document.getElementById('address').value = custAddress;
  document.getElementById('city').value    = custCity;
  document.getElementById('zip').value     = custZip;
  document.getElementById('state').value   = custState;
  document.getElementById('country').value = custCountry || 'US';

  document.getElementById('order-total').textContent = '$' + parseFloat(amount).toFixed(2);
  const itemsContainer = document.getElementById('order-items');
  if (itemsRaw) {
    try {
      const items = JSON.parse(decodeURIComponent(itemsRaw));
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'order-row';
        row.innerHTML = '<span>' + item.title + ' x' + item.quantity + '</span><span>$' + parseFloat(item.price * item.quantity).toFixed(2) + '</span>';
        itemsContainer.appendChild(row);
      });
    } catch(e) {
      itemsContainer.innerHTML = '<div class="order-row"><span>Order #' + orderId + '</span><span></span></div>';
    }
  } else {
    itemsContainer.innerHTML = '<div class="order-row"><span>Order #' + orderId + '</span><span></span></div>';
  }

  document.getElementById('ccnum').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '').substring(0, 16);
    e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
  });

  function validate() {
    const fields = ['fname','lname','email','phone','address','city','zip','state','country','ccnum','ccmonth','ccyear','cvc'];
    for (const id of fields) {
      const el = document.getElementById(id);
      if (!el.value.trim()) { showError('Please fill in all required fields.'); el.focus(); return false; }
    }
    const cc = document.getElementById('ccnum').value.replace(/\s/g,'');
    if (cc.length !== 16) { showError('Please enter a valid 16-digit card number.'); return false; }
    const month = document.getElementById('ccmonth').value;
    if (!/^(0[1-9]|1[0-2])$/.test(month)) { showError('Expiry month must be 01-12.'); return false; }
    const year = document.getElementById('ccyear').value;
    if (!/^\d{4}$/.test(year) || parseInt(year) < new Date().getFullYear()) { showError('Please enter a valid expiry year.'); return false; }
    const cvc = document.getElementById('cvc').value;
    if (!/^\d{3,4}$/.test(cvc)) { showError('CVC must be 3 digits.'); return false; }
    return true;
  }

  function showError(msg) {
    const el = document.getElementById('alert-error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alert-success').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showSuccess(msg) {
    const el = document.getElementById('alert-success');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alert-error').style.display = 'none';
  }

  function hideAlerts() {
    document.getElementById('alert-error').style.display = 'none';
    document.getElementById('alert-success').style.display = 'none';
  }

  async function handlePay() {
    hideAlerts();
    if (!validate()) return;
    const btn = document.getElementById('pay-btn');
    btn.textContent = 'Processing...';
    btn.disabled = true;

    const payload = {
      shopify_order_id:    orderId,
      shopify_order_token: orderToken,
      amount:              parseFloat(amount).toFixed(2),
      currency:            currency,
      email:               document.getElementById('email').value.trim(),
      first_name:          document.getElementById('fname').value.trim(),
      last_name:           document.getElementById('lname').value.trim(),
      phone:               document.getElementById('phone').value.trim(),
      address:             document.getElementById('address').value.trim(),
      city:                document.getElementById('city').value.trim(),
      zip:                 document.getElementById('zip').value.trim(),
      state:               document.getElementById('state').value.trim().toUpperCase(),
      country:             document.getElementById('country').value.trim().toUpperCase(),
      cc_number:           document.getElementById('ccnum').value.replace(/\s/g,''),
      cc_month:            document.getElementById('ccmonth').value.trim(),
      cc_year:             document.getElementById('ccyear').value.trim(),
      cc_cvc:              document.getElementById('cvc').value.trim(),
      customer_ip:         '',
    };

    try {
      const res = await fetch('/payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.status === 'approved') {
        showSuccess('Payment approved! Redirecting...');
        setTimeout(() => {
          window.location.href = 'https://0n0iy0-fq.myshopify.com/thank_you?order_id=' + orderId + '&order_token=' + orderToken;
        }, 1500);

      } else if (data.status === 'pending_3ds') {
        const frame = document.getElementById('threeds-frame');
        if (data.redirect_method === 'GET') {
          frame.src = data.redirect_url;
        } else {
          const p = (data.posted_parameters || []).map(p => '<input type="hidden" name="' + p.key + '" value="' + p.value + '"/>').join('');
          frame.srcdoc = '<form method="POST" action="' + data.redirect_url + '">' + p + '</form><script>document.forms[0].submit();<\/script>';
        }
        document.getElementById('threeds-overlay').classList.add('active');
        btn.textContent = 'Awaiting authentication...';

      } else {
        showError(data.message || 'Payment declined. Please check your card details and try again.');
        btn.textContent = 'Complete payment';
        btn.disabled = false;
      }
    } catch (err) {
      showError('A network error occurred. Please try again.');
      btn.textContent = 'Complete payment';
      btn.disabled = false;
    }
  }

  function closeThreeDs() {
    document.getElementById('threeds-overlay').classList.remove('active');
    document.getElementById('threeds-frame').src = '';
    const btn = document.getElementById('pay-btn');
    btn.textContent = 'Complete payment';
    btn.disabled = false;
  }

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'threeds_complete') {
      closeThreeDs();
      if (e.data.status === 'approved') {
        showSuccess('Payment approved! Redirecting...');
        setTimeout(() => {
          window.location.href = 'https://0n0iy0-fq.myshopify.com/thank_you?order_id=' + orderId + '&order_token=' + orderToken;
        }, 1500);
      } else {
        showError('Authentication failed. Please try again or use a different card.');
      }
    }
  });
</script>
</body>
</html>
